name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs on the same ref (e.g. when a PR is force-pushed) so we
# don't burn minutes on stale commits.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: checkout only needs to read the repo (the setup-node npm
# cache uses its own runtime token). Caps the token even if the repo/org
# default grants write access, since `npm ci` runs third-party install scripts.
permissions:
  contents: read

jobs:
  test:
    name: Test (node version ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # Install + test + build + typecheck take ~30 s locally; this only stops a
    # hang from holding the runner for GitHub's 6-hour default. Applies to each
    # Node version in the matrix separately.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Engines field in package.json says node >= 16, but 16 is EOL.
        # 18 is the floor users in practice will run; 20 + 22 are current LTS.
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes; keep the token out of .git/config, where
          # install scripts run by `npm ci` could read it.
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Typecheck declaration files
        run: npm run typecheck
