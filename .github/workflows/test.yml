name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs on the same ref (e.g. when a PR is force-pushed) so we
# don't burn minutes on stale commits.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (node version ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Engines field in package.json says node >= 16, but 16 is EOL.
        # 18 is the floor users in practice will run; 20 + 22 are current LTS.
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Typecheck declaration files
        run: npm run typecheck
