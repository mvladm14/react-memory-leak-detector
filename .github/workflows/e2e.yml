name: e2e

# Real end-to-end pipeline: pack the detector, install it into a real Vite app,
# and run it in headless Chromium (with --expose-gc) to prove LIVE leak
# detection across the @vitejs/plugin-react v5/v6 x engine oxc/babel matrix.
# Runs inside a Docker container with the repo bind-mounted (see e2e/).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the leak-detector matrix in Docker
        # Builds the harness image (Node 22 + Playwright Chromium), bind-mounts
        # the repo, and runs all four combos. The image CMD does
        # `npm ci && node e2e/run.mjs`.
        run: docker compose -f e2e/docker-compose.yml run --build --rm -T e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
